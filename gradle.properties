# ============================================================
# Gradle 全局属性配置
# ============================================================

# JVM 内存：默认 512MB 编译大型 Android 项目容易 OOM，加大到 2GB
# file.encoding=UTF-8：保证中文注释 / 字符串在构建中不出现乱码
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 使用 AndroidX 库（2018 年后新项目必须开启）
android.useAndroidX=true

# R 类非传递：每个模块只能引用自己的 R 类，
# 避免模块间 R 类互相污染（两个模块都有 ic_launcher 等同名资源）
android.nonTransitiveRClass=true

# Kotlin 官方代码风格约定
kotlin.code.style=official

# 并行构建：app 与 notification 两个模块可以同时编译，加快速度
org.gradle.parallel=true

# 构建缓存：重复构建时复用上一次结果
org.gradle.caching=true

# 说明：不要在这里写 org.gradle.java.home 固定 JDK 路径，
# 保持项目可移植。本机编译由 Android Studio 自动使用其内置 JBR（JDK 25），
# 命令行编译时需先设置 JAVA_HOME 指向 JDK 17 及以上版本。

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
